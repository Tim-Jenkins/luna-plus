name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows-win32:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:\vcpkg
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Update vcpkg so the manifest baseline is available
        run: git -C $env:VCPKG_ROOT fetch --quiet origin

      - name: Configure
        run: cmake --preset win32

      - name: Build
        run: cmake --build --preset win32-release -- /p:CL_MPCount=4 /m

      - name: Upload binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luna-win32-release
          path: build/win32/bin/Release/
          if-no-files-found: ignore
